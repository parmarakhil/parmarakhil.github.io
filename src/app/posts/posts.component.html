<section id="posts">
    <div class="container">
        <div class="top-container">
            <div class="title">
                <h1 i18n="nav@@posts">Posts</h1>
                <div class="sort-controls">
                    <button 
                        class="sort-btn" 
                        [class.active]="sortBy === 'recent'"
                        (click)="onSortChange('recent')"
                        i18n="posts@@sort-recent">
                        Recent
                    </button>
                    <button 
                        class="sort-btn" 
                        [class.active]="sortBy === 'popular'"
                        (click)="onSortChange('popular')"
                        i18n="posts@@sort-popular">
                        Most Liked
                    </button>
                </div>
            </div>
            <div class="navigation">
                <a href="javascript:void(0)" class="previous" (click)="onClickPrevious()" [ngClass]="{'disabled': currentPage === 1}">
                    <div class="molding">
                        <fa-icon [icon]="faChevronLeft" class="icon" i18n-title="exp.nav@@previous" title="Previous"></fa-icon>
                        <span i18n="exp.nav@@previous">Previous</span>
                    </div>
                </a>
                <div class="divider">|</div>
                <a href="javascript:void(0)" class="next" (click)="onClickNext()" [ngClass]="{'disabled': currentPage === ceil(posts?.length / resultsPerPage) }">
                    <div class="molding">
                        <span i18n="exp.nav@@next">Next</span>
                        <fa-icon [icon]="faChevronRight" class="icon" i18n-title="exp.nav@@next" title="Next"></fa-icon>
                    </div>
                </a>
            </div>
        </div>
        <p class="synopsis" i18n="posts@@synopsis">Explore my latest thoughts and insights on software development, career growth, and technology trends from my Medium blog.</p>
        
        <div class="loading-container" *ngIf="isLoading">
            <div class="loading-spinner"></div>
            <p>Loading posts...</p>
        </div>
        
        <div class="middle-container" *ngIf="!isLoading">
            <app-posts-carousel
                [posts]="posts"
                [currentPage]="currentPage"
                (onResultsPerPageChanged)="updateNavigation($event)"></app-posts-carousel>
        </div>
    </div>
</section>
