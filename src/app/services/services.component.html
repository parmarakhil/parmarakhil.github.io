<section id="mentorship" class="bg-slate-950 px-4 py-16 sm:px-6 lg:px-8 lg:py-24">
    <div class="mx-auto max-w-7xl rounded-[2rem] border border-white/10 bg-white/5 p-6 shadow-2xl shadow-slate-950/30 sm:p-8 lg:p-10">
        <div class="mx-auto max-w-3xl text-center">
            <span class="text-sm font-semibold uppercase tracking-[0.28em] text-indigo-200">Mentorship</span>
            <h2 class="mt-4 font-display text-3xl font-bold text-white sm:text-4xl">Mentorship Programs</h2>
            <p class="mt-4 text-base leading-8 text-slate-300">
                High-conviction plans for engineers targeting product-based companies through sharper DSA, LLD, resume, and interview prep.
            </p>
        </div>

        <div class="mt-10 grid gap-5 lg:grid-cols-3">
            <app-mentorship-plan-card *ngFor="let plan of plans" [plan]="plan" [compact]="true"></app-mentorship-plan-card>
        </div>

        <div class="mt-12 flex justify-center">
            <a routerLink="/mentorship" class="inline-flex items-center justify-center rounded-2xl bg-indigo-500 px-6 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-400">
                View All Plans
            </a>
        </div>
    </div>
</section>
