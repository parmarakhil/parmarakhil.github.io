<div [@fadeOut]="currentState" class="clock-gate-container">
  <button
    type="button"
    class="clock-wrapper"
    aria-label="Make a wish and click the time"
    (click)="onClockClick()"
    [disabled]="isHidden"
  >
    <div class="clock-display">11:11</div>
    <div class="prompt-text">Make a wish and click the time.</div>
  </button>
</div>
