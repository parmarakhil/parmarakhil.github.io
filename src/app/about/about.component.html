<section id="about" itemscope itemtype="https://schema.org/AboutPage">
    <div class="about-container" itemscope itemtype="https://schema.org/Person">
        <!-- structured data properties -->
        <meta itemprop="jobTitle" content="Member of Technical Staff 1 (MTS 1) - eBay" />
        <meta itemprop="knowsLanguage" content="en" />
        <meta itemprop="nationality" content="India" />
        <meta itemprop="gender" content="Male" />
        <meta itemprop="email" content="akhilparmar2496@gmail.com" />
        <meta itemprop="birthDate" content="1996-04-24" />
        <meta itemprop="url" content="https://parmarakhil.github.io/parmarakhil.github.io/" />
        
        <div class="second-column">
            <div class="profile-picture"></div>
            <div class="social-media">
                <a *ngFor="let media of aboutData?.medias" href="{{ media.http }}" target="_blank" itemprop="sameAs">
                    <fa-icon [icon]="['fab', media.icon]" class="icon" title="{{ media.title }}"></fa-icon>
                </a>
            </div>
            <!-- Hobbies/Interests -->
            <div class="hobbies">
                <h3>Interests</h3>
                <div class="hobbies-list">
                    <fa-icon *ngFor="let hobby of aboutData?.hobbies" [icon]="['fas', hobby.icon]" class="icon" title="{{ hobby.title }}" itemprop="hobby"></fa-icon>
                </div>
            </div>
        </div>

        <div class="first-column">
            <h1 i18n="nav@@aboutMe" class="section-title-decorative">About me</h1>
            <h2><span itemprop="name">{{ name }}</span></h2>
            <p class="years-old">
                <span itemprop="yearsOld">{{ yearsOld }}</span>
                &nbsp;<span i18n="about@@yearsOld">years old</span>
            </p>
            <p class="text" internationalization [data]="aboutData?.internationalizations" property='description' itemprop="summary">Loading Data...</p>
            
            <div class="about-tabs">
                <!-- Achievements Section -->
                <div class="achievements-section" *ngIf="aboutData?.achievements && aboutData.achievements.length > 0">
                    <h3>Achievements</h3>
                    <div class="achievements-list">
                        <div class="achievement-item" *ngFor="let achievement of aboutData.achievements">
                            <div class="achievement-marker"></div>
                            <div class="achievement-content">
                                <h4>{{ achievement.title }}</h4>
                                <p>{{ achievement.description }}</p>
                                <div class="achievement-meta">
                                    <span class="achievement-year">{{ achievement.year }}</span>
                                    <span class="achievement-date-range" *ngIf="achievement.dateRange">{{ achievement.dateRange }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
